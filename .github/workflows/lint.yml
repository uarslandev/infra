name: Ansible Lint & Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validation:
    name: Playbook Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible & Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Install Galaxy Collections
        run: |
          ansible-galaxy collection install -r requirements/common.yml

      - name: Syntax Check Playbooks
        run: |
          ansible-playbook main.yml --syntax-check
          ansible-playbook site.yml --syntax-check
          ansible-playbook workstation.yml --syntax-check
          ansible-playbook pc.yml --syntax-check
          ansible-playbook thinkpad.yml --syntax-check
          ansible-playbook sync.yml --syntax-check

      - name: Run Ansible Lint
        run: |
          ansible-lint main.yml

  homelab:
    name: Homelab Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible & Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Install pinned homelab collections
        run: ansible-galaxy collection install -r requirements/homelab.yml

      - name: Secrets are encrypted
        run: bash scripts/homelab/check-secrets.sh

      - name: Ansible syntax + lint (production profile)
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          ansible-playbook -i inventories/homelab homelab.yml --syntax-check
          ansible-lint --profile production homelab.yml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform fmt + validate
        run: |
          for root in terraform/proxmox terraform/cloudflare; do
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
