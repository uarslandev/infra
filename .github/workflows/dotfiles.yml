name: Dev environment (dotfiles/)

# Checks for the dev environment project in dotfiles/ (moved here from github.com/uarslandev/dotfiles).
# Only runs when it, the bootstrap or this workflow changes.
on:
  push:
    branches: [main]
    paths: ['dotfiles/**', 'bin/dotfiles', '.github/workflows/dotfiles.yml', '.github/dotfiles-markdown-link-config.json']
  pull_request:
    branches: [main]
    paths: ['dotfiles/**', 'bin/dotfiles', '.github/workflows/dotfiles.yml', '.github/dotfiles-markdown-link-config.json']

jobs:
  ansible-lint:
    name: Ansible syntax + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotfiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible & Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements/common.yml
      - name: Syntax check
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: ansible-playbook main.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint main.yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './dotfiles/bin'
          additional_files: 'bin/dotfiles'
          severity: error
          format: gcc
          disable_matcher: true
      - name: Other shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './dotfiles'
          severity: error
          format: gcc
          disable_matcher: true
          ignore_paths: |
            roles
            docs

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: |
          cat > /tmp/yamllint.yml << 'EOF'
          extends: default
          rules:
            line-length: disable
            comments: disable
            indentation:
              spaces: 2
            truthy:
              allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
            document-start: disable
            new-line-at-end-of-file: disable
            trailing-spaces: disable
            empty-lines: disable
            brackets: disable
            colons: disable
            braces: disable
          EOF
          yamllint -c /tmp/yamllint.yml -f github dotfiles

  markdown:
    name: Markdown lint + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: markdownlint
        run: |
          cat > /tmp/markdownlint.json << 'EOF'
          {
            "default": true,
            "MD001": false, "MD004": false, "MD009": false, "MD012": false, "MD013": false,
            "MD022": false, "MD024": false, "MD026": false, "MD029": false, "MD031": false,
            "MD032": false, "MD033": false, "MD036": false, "MD040": false, "MD041": false,
            "MD045": false, "MD047": false, "MD051": false, "MD058": false
          }
          EOF
          npx -y markdownlint-cli@0.49.1 --config /tmp/markdownlint.json "dotfiles/**/*.md"
      - name: Links
        run: |
          status=0
          for f in $(find dotfiles -name "*.md"); do
            npx -y markdown-link-check@3.15.0 "$f" --config .github/dotfiles-markdown-link-config.json || status=1
          done
          exit $status
