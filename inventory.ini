# ==============================================================================
# Ansible Multi-Environment Inventory
# ==============================================================================

# Local host node (Default target for local runs on any OS)
localhost ansible_connection=local

[local]
localhost ansible_connection=local
pc ansible_connection=local
thinkpad ansible_connection=local

# Bare-metal / Desktop Workstations
[workstations]
localhost
pc
thinkpad

# WSL environments
[wsl]
# wsl-instance ansible_connection=local

# Virtual Machines (Fedora VM, Ubuntu VM, etc.)
[vms]
# fedora-vm ansible_connection=local
# ubuntu-vm ansible_connection=local

# Homelab servers live in inventories/homelab/ (used only by homelab.yml).

# Meta-group combining all developer machines
[dev_machines:children]
workstations
wsl
vms
