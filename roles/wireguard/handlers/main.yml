---
- name: Unload wg-quick AppArmor profile
  ansible.builtin.command: apparmor_parser --remove /etc/apparmor.d/wg-quick
  register: wireguard_apparmor_unload
  changed_when: wireguard_apparmor_unload.rc == 0
  failed_when: false

- name: Restart wg0
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: restarted
