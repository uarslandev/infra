---
# ==============================================================================
# Workstation Role - Multi-Distribution Entrypoint
# ==============================================================================

- name: Workstation | Check for distribution task file
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distro_task_stat

- name: Workstation | Execute distribution-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distro_task_stat.stat.exists

- name: Workstation | Inform if distribution task file is missing
  ansible.builtin.debug:
    msg: "No distribution-specific tasks for '{{ ansible_facts['distribution'] }}'. Skipping OS package tasks."
  when: not distro_task_stat.stat.exists

# ------------------------------------------------------------------------------
# Utility Scripts Deployment (Cross-Platform)
# ------------------------------------------------------------------------------

- name: Deploy tmux-sessionizer utility script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/tmux-sessionizer"
    dest: "{{ user_bin }}/tmux-sessionizer"
    mode: '0755'
  failed_when: false

- name: Deploy pkgSync utility script (Arch Linux)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/pkgSync"
    dest: "{{ user_bin }}/pkgSync"
    mode: '0755'
  when: ansible_facts['distribution'] == 'Archlinux'
  failed_when: false

- name: Deploy dotfiles CLI runner
  ansible.builtin.file:
    src: "{{ playbook_dir }}/bin/dotfiles"
    dest: "{{ user_bin }}/dotfiles"
    state: link
    force: true
  failed_when: false

# ------------------------------------------------------------------------------
# System Services (Bare-metal only; skipped on WSL). The display manager is left
# to the OS installer and never switched here.
# ------------------------------------------------------------------------------

- name: Desktop | Enable system services
  when:
    - not ansible_host_environment_is_wsl
    - dotfiles_session == 'desktop'
    - (ansible_facts['service_mgr'] | default(ansible_service_mgr | default(''))) == "systemd"
    - can_become | default(false)
  block:
    - name: Combine shared and host-specific systemd services
      ansible.builtin.set_fact:
        managed_system_services: "{{ ((system_services | default([])) + (host_system_services | default([]))) | unique }}"

    - name: Enable default systemd services
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: "{{ 'started' if (ansible_facts['is_chroot'] is not defined or not ansible_facts['is_chroot']) else omit }}"
      loop: "{{ managed_system_services | default([]) }}"
      failed_when: false
      when: (managed_system_services | default([])) | length > 0
