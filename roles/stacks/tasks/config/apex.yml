---
# APEX: clone the private repo at the pinned commit (read-only deploy key) so compose can build the image,
# and prepare the data directory for the unprivileged PocketBase user.
- name: APEX | GitHub host key (pinned, no trust-on-first-use)
  ansible.builtin.copy:
    content: "github.com {{ apex_github_host_key }}\n"
    dest: "{{ stacks_root }}/apex/known_hosts"
    owner: root
    group: root
    mode: "0644"

- name: APEX | Read-only deploy key for the private repo
  ansible.builtin.copy:
    content: "{{ apex_deploy_key | trim }}\n" # ssh refuses a key without the final newline
    dest: "{{ stacks_root }}/apex/deploy_key"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: APEX | Source at the pinned commit
  ansible.builtin.git:
    repo: "{{ apex_repo }}"
    dest: "{{ stacks_root }}/apex/src"
    version: "{{ apex_version }}"
    key_file: "{{ stacks_root }}/apex/deploy_key"
    ssh_opts: "-o UserKnownHostsFile={{ stacks_root }}/apex/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
    accept_newhostkey: false
    force: true # the checkout is build input only; local edits are never wanted

- name: APEX | Data directory on tank/apex
  ansible.builtin.file:
    path: /srv/apex/pb_data
    state: directory
    owner: "{{ apex_uid }}"
    group: "{{ apex_uid }}"
    mode: "0750"
