---
- name: Stacks | Root directory
  ansible.builtin.file:
    path: "{{ stacks_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Checked before anything is touched, so a missing token cannot leave the LAN without a reverse proxy.
- name: Stacks | Traefik needs a real Cloudflare DNS token
  ansible.builtin.assert:
    that:
      - cloudflare_dns_api_token is defined
      - cloudflare_dns_api_token | length > 30
      - "' ' not in cloudflare_dns_api_token"
    fail_msg: cloudflare_dns_api_token in secrets/homelab.sops.yml is missing or still the example text
  when: "'traefik' in stacks_enabled"
  no_log: true

- name: Stacks | Shared network for the reverse proxy
  community.docker.docker_network:
    name: proxy
    state: present

# Retired stacks go first, so their ports are free for the stacks replacing them.
- name: Stacks | Find retired stacks still deployed
  ansible.builtin.stat:
    path: "{{ stacks_root }}/{{ item }}/compose.yml"
  loop: "{{ stacks_absent }}"
  register: stacks_absent_stat

- name: Stacks | Remove retired stacks (data on ZFS is kept)
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/{{ item.item }}"
    state: absent
  loop: "{{ stacks_absent_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Stacks | Remove retired stack directories
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ item }}"
    state: absent
  loop: "{{ stacks_absent }}"

- name: Stacks | Deploy each stack
  ansible.builtin.include_tasks: stack.yml
  loop: "{{ stacks_enabled }}"
  loop_control:
    loop_var: stack
