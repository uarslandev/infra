---
# ==============================================================================
# Dotfiles Role
# The dotfiles repo is its own Ansible project (roles for zsh, neovim, tmux, docker, ...),
# so it is cloned and its playbook is run as-is. Roles without tasks for the current
# distribution (e.g. plasma on Ubuntu, macOS-only roles) skip themselves there.
# ==============================================================================

- name: Dotfiles | Clone the dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_repo_dir }}"
    update: false

# Plain fast-forward pull: never discards local edits or unpushed commits (the git module can reset them).
- name: Dotfiles | Update the dotfiles repository
  ansible.builtin.command:
    cmd: git pull --ff-only
    chdir: "{{ dotfiles_repo_dir }}"
  register: dotfiles_git
  changed_when: "'Already up to date' not in dotfiles_git.stdout"
  failed_when: false
  when: not ansible_check_mode

- name: Dotfiles | Warn when the repository could not be updated (local changes?)
  ansible.builtin.debug:
    msg: "Could not update {{ dotfiles_repo_dir }}, running the checked-out version: {{ dotfiles_git.stderr | default('') }}"
  when: (dotfiles_git.rc | default(0)) != 0

# In --check mode nothing is cloned, so the rest is skipped on a first run.
- name: Dotfiles | Check for the cloned repository
  ansible.builtin.stat:
    path: "{{ dotfiles_repo_dir }}/main.yml"
  register: dotfiles_repo_stat

- name: Dotfiles | Skip note for --check without a clone
  ansible.builtin.debug:
    msg: "{{ dotfiles_repo_dir }} is not cloned yet (check mode): skipping the dotfiles playbook."
  when: not dotfiles_repo_stat.stat.exists

- name: Dotfiles | Install the dotfiles repo's Ansible collections
  when: dotfiles_repo_stat.stat.exists
  ansible.builtin.command:
    cmd: ansible-galaxy collection install -r requirements/common.yml
    chdir: "{{ dotfiles_repo_dir }}"
  register: dotfiles_galaxy
  changed_when: "'was installed successfully' in dotfiles_galaxy.stdout"

- name: Dotfiles | Run the dotfiles playbook
  when: dotfiles_repo_stat.stat.exists
  block:
    # Ansible does not expose a -K password to tasks; one passed as a variable (bin/dotfiles does) is
    # handed on the same way, through a private temp file that is removed afterwards.
    - name: Dotfiles | Private temp file for the sudo password
      ansible.builtin.tempfile:
        path: "{{ ansible_facts['env']['XDG_RUNTIME_DIR'] | default(omit) }}"
        prefix: dotfiles-become.
      register: dotfiles_become_file
      when: ansible_become_password is defined

    - name: Dotfiles | Write the sudo password for the nested run
      ansible.builtin.copy:
        content: >-
          {{ {'ansible_become_password': ansible_become_password}
             | combine({'ansible_become_exe': ansible_become_exe} if ansible_become_exe is defined else {})
             | to_json }}
        dest: "{{ dotfiles_become_file.path }}"
        mode: "0600"
      no_log: true
      when: ansible_become_password is defined

    - name: Dotfiles | Progress of the nested run
      ansible.builtin.debug:
        msg: "Running {{ dotfiles_repo_dir }}/main.yml (takes a while). Follow it with: tail -f {{ dotfiles_log }}"

    - name: Dotfiles | ansible-playbook main.yml in the dotfiles repo
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ansible-playbook main.yml
          {{ ('-e @' + dotfiles_become_file.path) if ansible_become_password is defined else '' }}
          {{ '--check' if ansible_check_mode else '' }}
          2>&1 | tee {{ dotfiles_log | quote }} | tail -n 40
        chdir: "{{ dotfiles_repo_dir }}"
        executable: /bin/bash
      environment:
        ANSIBLE_CONFIG: "{{ dotfiles_repo_dir }}/ansible.cfg"
        ANSIBLE_FORCE_COLOR: "0"
      check_mode: false
      register: dotfiles_run
      changed_when: dotfiles_run.stdout is regex('changed=[1-9]')

    - name: Dotfiles | Result
      ansible.builtin.debug:
        var: dotfiles_run.stdout_lines
  always:
    - name: Dotfiles | Remove the sudo password file
      ansible.builtin.file:
        path: "{{ dotfiles_become_file.path }}"
        state: absent
      when: dotfiles_become_file.path is defined
