---
# apt-key is gone since Ubuntu 25.10; deb822_repository downloads the key itself.
- name: "1Password | Add APT Repo"
  ansible.builtin.deb822_repository:
    name: 1password
    types: [deb]
    uris: "https://downloads.1password.com/linux/debian/{{ ansible_facts['machine'] | replace('x86_64', 'amd64') }}"
    suites: [stable]
    components: [main]
    architectures: ["{{ ansible_facts['machine'] | replace('x86_64', 'amd64') }}"]
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
  become: true
  when: can_become | default(false)

- name: "1Password | Add debsig-verify policy"
  become: true
  when: can_become | default(false)
  block:
    - name: "1Password | Ensure policy directory exists"
      ansible.builtin.file:
        name: /etc/debsig/policies/AC2D62742012EA22
        state: directory
        mode: "0755"

    - name: "1Password | Copy debsig-verify policy"
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/debian/debsig/1password.pol
        dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
        mode: "0644"

    - name: "1Password | Ensure debsig keyring directory exists"
      ansible.builtin.file:
        name: /usr/share/debsig/keyrings/AC2D62742012EA22
        state: directory
        mode: "0755"

    # debsig-verify needs a binary (dearmored) keyring.
    - name: "1Password | Add debsig keyring"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          curl -fsSL https://downloads.1password.com/linux/keys/1password.asc
          | gpg --dearmor --yes -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
        executable: /bin/bash
        creates: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg

- name: "1Password | Install 1Password"
  ansible.builtin.apt:
    name:
      - 1password
      - 1password-cli
    state: present
    update_cache: true
  become: true
  when: can_become | default(false)

- name: "1Password | Ubuntu | Package install skipped (no sudo)"
  ansible.builtin.debug:
    msg: "1Password package installation skipped because sudo is not available."
  when: not (can_become | default(false))
