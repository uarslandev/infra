---
# The flatpak role installs Obsidian from Flathub on desktops. It runs later, so flatpak itself
# is not installed yet at this point (and `XDG_CURRENT_DESKTOP | bool` was always false anyway).
- name: "Obsidian | Ubuntu | Installed by the flatpak role"
  ansible.builtin.debug:
    msg: "Obsidian is installed from Flathub by the flatpak role."


