---
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

- name: "{{ role_name }} | Clone SecondBrain vault"
  ansible.builtin.git:
    repo: "{{ obsidian_repo }}"
    dest: "{{ obsidian_dest }}"
    update: false
  failed_when: false
  when: obsidian_repo | default('') | length > 0

- name: "{{ role_name }} | Vault repo not configured"
  ansible.builtin.debug:
    msg: "Set obsidian.repo in group_vars/all.yml (git URL of your vault) to clone it automatically."
  when: obsidian_repo | default('') | length == 0
