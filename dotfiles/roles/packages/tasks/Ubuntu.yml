---
- name: "Packages | Ubuntu | Install base packages"
  ansible.builtin.apt:
    name: "{{ packages_ubuntu }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: can_install_packages | default(false)

# Ubuntu ships fd as `fdfind`.
- name: "Packages | Ubuntu | Link fd"
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
    force: false
  become: true
  when: can_install_packages | default(false)
  failed_when: false

- name: "Packages | Ubuntu | Packages skipped (no sudo)"
  ansible.builtin.debug:
    msg: "Base package installation skipped because sudo is not available."
  when: not (can_install_packages | default(false))
