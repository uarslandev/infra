---
- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install dependencies"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: true
  when: can_install_packages | default(false)

# apt-key is gone since Ubuntu 25.10; deb822_repository downloads the key itself.
# Named vscode.sources, the same file the code package writes, so the repo is never listed twice.
- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Add Microsoft repository"
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    suites: [stable]
    components: [main]
    architectures: [amd64, arm64, armhf]
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  become: true
  when: can_install_packages | default(false)

- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install VS Code"
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  become: true
  when: can_install_packages | default(false)

- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Packages skipped (no sudo)"
  ansible.builtin.debug:
    msg: "Package installation skipped: code"
  when: not (can_install_packages | default(false))
