---
- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install AUR build dependencies"
  community.general.pacman:
    name:
      - base-devel
      - git
    state: present
  become: true
  when: can_install_packages | default(false)

- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install VS Code (AUR)"
  kewlfft.aur.aur:
    name: visual-studio-code-bin
    state: present
  when: can_install_packages | default(false)

- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Packages skipped (no sudo)"
  ansible.builtin.debug:
    msg: "Package installation skipped: visual-studio-code-bin"
  when: not (can_install_packages | default(false))
