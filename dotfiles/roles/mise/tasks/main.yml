---
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

- name: "Mise | Config directory"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/mise"
    state: directory
    mode: "0755"

- name: "Mise | Link global config"
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.toml"
    dest: "{{ ansible_facts['user_dir'] }}/.config/mise/config.toml"
    state: link
    force: true

# Installs the pinned runtimes from the global config; a no-op when they are already there.
- name: "Mise | Install global runtimes"
  ansible.builtin.command: mise install --yes
  environment:
    PATH: "{{ ansible_facts['user_dir'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: mise_install
  changed_when: "'installed 0 tools' not in (mise_install.stdout + mise_install.stderr)"
  when: not ansible_check_mode
