---
- name: "BTOP | Ubuntu | Install btop package"
  when: can_install_packages | default(false)
  ansible.builtin.apt:
    name: btop
    state: present
    update_cache: true
  become: true

- name: "BTOP | Ubuntu | Remove old bpytop if installed"
  when: can_install_packages | default(false)
  ansible.builtin.apt:
    name: bpytop
    state: absent
  become: true
  ignore_errors: true
