---
# Public, free Nerd Font installed as a fallback so terminal/editor glyphs
# render even when the private BerkeleyMono Nerd Font (from 1Password) is not
# available. Installed to ~/.local/share/fonts, no sudo required.
nerd_font_name: JetBrainsMono
nerd_font_install_dir: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
nerd_font_marker_file: "JetBrainsMonoNerdFont-Regular.ttf"