---
- name: "Fonts | Fedora | Install font tooling"
  ansible.builtin.dnf:
    name:
      - fontconfig
    state: present
  become: true
  when: can_install_packages | default(false)

- name: "Fonts | Fedora | Install public Nerd Font"
  ansible.builtin.include_tasks: public_nerd_font.yml

- name: "Fonts | Fedora | Install BerkeleyMono Nerd Font"
  ansible.builtin.include_tasks: private_berkeley_mono.yml
  vars:
    berkeley_mono_install_dir: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
    berkeley_mono_refresh_cache: true
  when: op.fonts.berkeley_mono is defined

- name: "Fonts | Fedora | BerkeleyMono skipped (not configured)"
  ansible.builtin.debug:
    msg: "BerkeleyMono skipped: set op.fonts.berkeley_mono in group_vars/all.yml to install it from 1Password."
  when: op.fonts.berkeley_mono is not defined
