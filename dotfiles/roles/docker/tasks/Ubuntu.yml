---
# Docker installation - REQUIRES SUDO/ADMIN ACCESS
# Based on official Docker documentation: https://docs.docker.com/engine/install/ubuntu/#installation-methods

- name: "Docker | {{ ansible_facts['distribution'] }} | Check sudo availability"
  ansible.builtin.debug:
    msg:
      - "⚠️  DOCKER INSTALLATION REQUIREMENTS:"
      - "- Sudo access: {{ 'Available ✓' if has_sudo | default(false) else 'NOT AVAILABLE ✗' }}"
      - "- Package installation: {{ 'Possible ✓' if can_install_packages | default(false) else 'NOT POSSIBLE ✗' }}"

- name: "Docker | {{ ansible_facts['distribution'] }} | No-sudo alternatives"
  ansible.builtin.debug:
    msg:
      - "Docker requires system-level access for:"
      - "- Installing packages, managing services, creating system groups"
      - ""
      - "Alternatives without sudo:"
      - "1. Use Podman instead (rootless containers)"
      - "2. Request Docker installation from your system administrator"
      - "3. Use Docker Desktop if available for your platform"
      - "4. Use a cloud-based development environment"
  when: not (has_sudo | default(false))

- name: "Docker | {{ ansible_facts['distribution'] }} | Skip if no sudo"
  meta: end_play
  when: not (has_sudo | default(false))

# Only proceed if we have sudo access
- name: "Docker | {{ ansible_facts['distribution'] }} | Installation with sudo"
  when: has_sudo | default(false)
  block:
    - name: "Docker | Update APT cache"
      ansible.builtin.apt:
        update_cache: true
      become: true

    - name: "Docker | Install dependencies"
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
      become: true

    - name: "Docker | Get System Architecture"
      ansible.builtin.command: "dpkg --print-architecture"
      register: dpkg_architecture
      changed_when: false
      failed_when: false
      check_mode: false

    # apt-key is gone since Ubuntu 25.10; deb822_repository downloads the key itself.
    - name: "Docker | Add Docker's stable repository"
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures: ["{{ dpkg_architecture.stdout }}"]
        signed_by: https://download.docker.com/linux/ubuntu/gpg
      become: true

    - name: "Docker | Install Docker Engine"
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true
      register: docker_install

    - name: "Docker | Enable service"
      ansible.builtin.systemd:
        enabled: true
        name: docker
        state: started
      become: true
      when: not ansible_host_environment_is_wsl

    - name: "Docker | Add user to docker group"
      ansible.builtin.user:
        append: true
        groups: docker
        name: "{{ ansible_facts['env']['USER'] }}"
      become: true
      register: docker_group_add

    # Creating the data dir as root would also create ~/.local/lib as root (mode 0710), locking the
    # user out of it (npm --prefix ~/.local then fails with EACCES). Create/repair the parent first.
    - name: "Docker | Ensure ~/.local/lib belongs to the user"
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/lib"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0755"
      become: true

    - name: "Docker | Ensure docker data directory exists"
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/lib/docker"
        state: directory
        mode: "0710"
      become: true

    - name: "Docker | Copy daemon.json"
      ansible.builtin.template:
        dest: "/etc/docker/daemon.json"
        src: "daemon.json"
        mode: "0644"
      become: true
      notify: restart_docker

    - name: "Docker | Installation complete"
      ansible.builtin.debug:
        msg:
          - "Docker installation status:"
          - "- Docker Engine: {{ '✓ Installed' if docker_install is succeeded else '✗ Failed' }}"
          - "- User added to docker group: {{ '✓' if docker_group_add is succeeded else '✗' }}"
          - ""
          - "NOTE: You may need to log out and back in for group changes to take effect."
          - "Or run: newgrp docker"
