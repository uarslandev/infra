---
- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install ncdu"
  ansible.builtin.dnf:
    name: ncdu
    state: present
  become: true
  when: can_install_packages | default(false)

- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Packages skipped (no sudo)"
  ansible.builtin.debug:
    msg: "Package installation skipped: ncdu"
  when: not (can_install_packages | default(false))
