---
- name: "FZF | Uninstall DNF fzf"
  ansible.builtin.dnf:
    name: fzf
    state: absent
  become: true
  when: can_install_packages | default(false)

- name: "FZF | Clone Latest Version"
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf.git
    depth: 1
    dest: "{{ ansible_facts['user_dir'] }}/.fzf"
  notify: "Install FZF"

- name: "FZF | Check if fzf is installed"
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.fzf/bin/fzf"
  register: fzf_binary

- name: "FZF | Ensure fzf is installed"
  ansible.builtin.shell: "{{ ansible_facts['user_dir'] }}/.fzf/install --all --no-update-rc --no-fish"
  when: not fzf_binary.stat.exists

# --no-update-rc leaves ~/.fzf/bin off PATH, and the dnf fzf was removed above; without this link
# `fzf` is not found (tmux-sessionizer and other scripts need it). ~/.local/bin is on PATH.
- name: "FZF | Link fzf into ~/.local/bin"
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/.fzf/bin/fzf"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/fzf"
    state: link
    force: true