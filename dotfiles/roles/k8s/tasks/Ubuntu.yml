---
- name: K8s | Adding kubernetes apt key
  when: can_install_packages | default(false)
  ansible.builtin.apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s.repo.version | default('v1.34') }}/deb/Release.key"
    state: present
    keyring: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
  become: true

- name: K8s | Adding kubernetes apt repo
  when: can_install_packages | default(false)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s.repo.version | default('v1.34') }}/deb/ /"
    filename: pkgs.k8s.io_core_stable_deb
    mode: "0644"
  become: true

- name: K8s | Installing Kubernetes
  when: can_install_packages | default(false)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    force: true
  loop:
    - kubectl
  become: true

# User-local installation without sudo
- name: "K8s | {{ ansible_facts['distribution'] }} | Detect kubectl"
  ansible.builtin.command: which kubectl
  register: k8s_kubectl_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (can_install_packages | default(false))

- name: "K8s | {{ ansible_facts['distribution'] }} | Resolve kubectl install directory"
  ansible.builtin.set_fact:
    k8s_kubectl_install_dir: "{{ k8s_kubectl_install_dir | default(ansible_facts['user_dir'] + '/.local/bin') }}"
  when: not (can_install_packages | default(false))

- name: "K8s | {{ ansible_facts['distribution'] }} | Fetch latest stable kubectl version"
  ansible.builtin.uri:
    url: "https://dl.k8s.io/release/stable.txt"
    return_content: true
  register: k8s_kubectl_stable
  check_mode: false
  when: not (can_install_packages | default(false))

- name: "K8s | {{ ansible_facts['distribution'] }} | Set kubectl download facts"
  ansible.builtin.set_fact:
    k8s_kubectl_url: "https://dl.k8s.io/release/{{ k8s_kubectl_stable.content | trim }}/bin/linux/{{ ansible_facts['machine'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}/kubectl"
  when: not (can_install_packages | default(false))

- name: "K8s | {{ ansible_facts['distribution'] }} | Ensure kubectl install directory exists"
  ansible.builtin.file:
    path: "{{ k8s_kubectl_install_dir }}"
    state: directory
    mode: "0755"
  when: not (can_install_packages | default(false))

- name: "K8s | {{ ansible_facts['distribution'] }} | Install kubectl binary"
  ansible.builtin.get_url:
    url: "{{ k8s_kubectl_url }}"
    dest: "{{ k8s_kubectl_install_dir }}/kubectl"
    mode: "0755"
  when: not (can_install_packages | default(false))

