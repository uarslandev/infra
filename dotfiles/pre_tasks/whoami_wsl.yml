---
- name: Detect Windows Current User
  ansible.builtin.shell:
    cmd: $env:UserName
  register: windows_user
  changed_when: false
  failed_when: false
  args:
    executable: powershell.exe

- name: Register Windows Current User
  ansible.builtin.set_fact:
    wsl_host_user: "{{ windows_user.stdout }}"
  when:
    - host_user is not defined
    - windows_user.rc == 0

- name: Warn when the Windows user could not be detected
  ansible.builtin.debug:
    msg: "Could not run powershell.exe from WSL (Windows interop unavailable); falling back to the WSL user."
  when: windows_user.rc | default(1) != 0

- name: DEBUG
  ansible.builtin.debug:
    msg: "wsl_host_user: {{ wsl_host_user | default('not detected') }}"
