---
# Arch/CachyOS pacman defaults. CachyOS mirrors can occasionally stall on large
# packages; this keeps package installs from failing due to curl's low-speed timer.
arch_pacman_extra_args: "--disable-download-timeout"
arch_pacman_update_cache_extra_args: "--disable-download-timeout"
arch_pacman_upgrade_extra_args: "--disable-download-timeout"

# --------------------------------------------------------------------
# ROLES
# --------------------------------------------------------------------
# Roles run in this order when you execute `dotfiles`.
# Run a subset with: dotfiles -t git,neovim

default_roles:
  # Core
  - system
  - 1password  # installed early so secret-backed roles can read the vault
  - fonts
  - git
  - bash
  # Editors & terminal
  - neovim
  - tmux
  - fzf
  - starship
  # File tools
  - bat
  - lsd
  - zoxide
  - btop
  - ncdu
  # Git workflow
  - gh
  - lazygit
  # Languages
  - python
  - nvm  # Must run before npm
  - npm
  - go
  - rust
  # Infrastructure
  - terraform
  - docker
  # Remote & network
  - ssh
  - sshfs
  # Misc dev tools
  - taskfile
  - tldr
  - opencode

# --------------------------------------------------------------------
# USER CONFIGURATION
# --------------------------------------------------------------------

# REQUIRED: Your name for git commits and configurations
git_user_name: "Umut Arslan"

# 1Password CLI account used by pre_tasks and secret-bearing roles.
# op_account: my.1password.com

# Optional keyboard layout for Linux system paths (localectl on Arch/Fedora).
# keyboard:
#   model: pc105
#   layout: us
#   options:
#     - caps:none

# --------------------------------------------------------------------
# 1PASSWORD INTEGRATION
# --------------------------------------------------------------------
# Secret references use the 1Password CLI format "op://VaultName/ItemName/Field".
# Everything fails soft when 1Password is missing or locked: affected roles
# skip secret sync and tell you how to retry. Never put plaintext secrets here.

op:
  git:
    user:
      email: "op://Personal/GitHub/email"
    # SSH allowed signers for commit verification:
    # <email> namespaces="git" <algo> <public key>
    allowed_signers: "op://Personal/GitHub SSH/allowed_signers"
  ssh:
    github:
      personal:
        - name: id_ed25519
          vault_path: "op://Personal/GitHub SSH"
  # Optional: paid font installed from your vault (see roles/fonts/README.md)
  # fonts:
  #   berkeley_mono:
  #     vault: "Private"
  #     item: "BerkeleyMono Fonts"
  #     files:
  #       - field: BerkeleyMonoNerdFont-Regular
  #         filename: BerkeleyMonoNerdFont-Regular.otf
  #       - field: BerkeleyMonoNerdFont-Italic
  #         filename: BerkeleyMonoNerdFont-Italic.otf
  #       - field: BerkeleyMonoNerdFont-Bold
  #         filename: BerkeleyMonoNerdFont-Bold.otf
  #       - field: BerkeleyMonoNerdFont-BoldItalic
  #         filename: BerkeleyMonoNerdFont-BoldItalic.otf

# --------------------------------------------------------------------
# LANGUAGE / TOOL CONFIG
# --------------------------------------------------------------------

go:
  packages:
    - package: github.com/go-task/task/v3/cmd/task@latest
      cmd: task
    # LSP servers for OpenCode
    - package: golang.org/x/tools/gopls@latest
      cmd: gopls
