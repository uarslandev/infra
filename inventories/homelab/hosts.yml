---
# Homelab inventory. Used only explicitly: ansible-playbook -i inventories/homelab homelab.yml
# (the dev-env bootstrap keeps using inventory.ini via ansible.cfg).
all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.0.123
          ansible_user: root
    docker_hosts:
      hosts:
        apps:
          ansible_host: 192.168.0.85
          ansible_user: umut
          ansible_become: true
    lxc:
      vars:
        ansible_user: root
      children:
        adguard:
          hosts:
            adguard-lxc:
              ansible_host: 192.168.0.162
        wireguard:
          hosts:
            wireguard-lxc:
              ansible_host: 192.168.0.93
