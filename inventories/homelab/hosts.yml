---
# Homelab inventory. Always pass it explicitly (no default, so a stray ansible command can't reach real hosts):
#   ansible-playbook -i inventories/homelab homelab.yml
all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.0.123
          ssh_aliases: [proxmox]
          ansible_user: root
    docker_hosts:
      hosts:
        apps:
          ansible_host: 192.168.0.85
          ansible_user: umut
          ansible_become: true
    lxc:
      vars:
        ansible_user: root
      children:
        adguard:
          hosts:
            adguard-lxc:
              ansible_host: 192.168.0.162
              ssh_aliases: [adguard]
        wireguard:
          hosts:
            wireguard-lxc:
              ansible_host: 192.168.0.93
              ssh_aliases: [wireguard]
