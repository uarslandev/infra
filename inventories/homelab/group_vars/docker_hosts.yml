---
# virtiofs shares from the Proxmox host (tag => mount point). Tags match terraform virtiofs_shares.
docker_host_virtiofs_mounts:
  immich: /srv/immich
  nextcloud: /srv/nextcloud
  jellyfin: /srv/jellyfin
  syncthing: /srv/syncthing
  appdata: /srv/appdata

# Stacks deployed from stacks/<name>/compose.yml, in this order.
stacks_enabled:
  - cloudflared
  - npm
  - immich
  - nextcloud
  - jellyfin
  - syncthing
  - teamspeak
  - monitoring

# Stacks to stop and remove (data on ZFS is kept).
stacks_absent:
  - uptime-kuma

stacks_root: /opt/stacks

# Blackbox HTTP checks (alert if a service stops answering).
monitoring_http_probes:
  - { name: immich, url: "http://192.168.0.85:2283/api/server/ping" }
  - { name: nextcloud, url: "http://192.168.0.85:8080/status.php" }
  - { name: jellyfin, url: "http://192.168.0.85:8096/health" }
  - { name: syncthing, url: "http://192.168.0.85:8384/rest/noauth/health" }
  - { name: grafana, url: "http://192.168.0.85:3000/api/health" }
  - { name: proxmox, url: "https://192.168.0.123:8006/" }

# Grafana dashboards from grafana.com (id + pinned revision).
monitoring_dashboards:
  - { name: node-exporter-full, id: 1860, revision: 45 }
  - { name: blackbox-exporter, id: 7587, revision: 3 }
  - { name: proxmox-pve-exporter, id: 10347, revision: 5 }
  - { name: cadvisor, id: 19792, revision: 6 }

# Alert e-mails via Gmail SMTP (app password). Credentials: alert_smtp_username,
# alert_smtp_password, alert_email_to in secrets/homelab.sops.yml.
alert_smtp_smarthost: smtp.gmail.com:587
