---
homelab_timezone: Europe/Berlin
homelab_secrets_file: "{{ playbook_dir }}/secrets/homelab.sops.yml"

# SSH public keys allowed on every homelab host (authorized_keys is managed exclusively).
# One key per device, plus one offline recovery key kept only in KeePass. See docs/homelab/README.md "Access".
ssh_access_authorized_keys:
  - "ssh-rsa  pc-windows-wsl"
  # - "ssh-ed25519 AAAA... recovery-offline"   # add once generated (see docs)
