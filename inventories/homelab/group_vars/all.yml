---
homelab_timezone: Europe/Berlin
homelab_secrets_file: "{{ playbook_dir }}/secrets/homelab.sops.yml"

# SSH public keys allowed on every homelab host (authorized_keys is managed exclusively).
# One key per device, plus one offline recovery key kept only in KeePass. See docs/homelab/README.md "Access".
ssh_access_authorized_keys:
  - "ssh-rsa  pc-windows-wsl"
  # Offline break-glass key: private part only in KeePass (with passphrase), never on a device.
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAhIkOMUAf2hGWDGp1HVB1VejJJ7iyqtS3uUTfygy62J recovery-offline"

# Domains. The public domain is derived from an encrypted secret so it never appears in plain text here.
# Local services live under home.<domain> (resolved only by AdGuard, trusted Let's Encrypt wildcard cert).
homelab_public_domain: "{{ jellyfin_published_url | urlsplit('hostname') | split('.', 1) | last }}"
homelab_local_domain: "home.{{ homelab_public_domain }}"
homelab_apps_ip: 192.168.0.85

# Networks allowed to reach admin UIs (LAN + WireGuard).
homelab_admin_networks:
  - 192.168.0.0/24
  - 10.0.0.0/24
