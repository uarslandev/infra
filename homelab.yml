---
# ==============================================================================
# Homelab playbook (separate from the dev-env main.yml)
#   make homelab            # or:
#   ANSIBLE_CONFIG=ansible.cfg ansible-playbook -i inventories/homelab homelab.yml
# Secrets: secrets/homelab.sops.yml (SOPS + age, decrypted in memory only).
# ==============================================================================

- name: Proxmox host
  hosts: proxmox
  tags: [proxmox]
  roles:
    - ssh_access
    - proxmox_host
    - zfs_datasets
    - sanoid
    - node_exporter

- name: Docker host
  hosts: docker_hosts
  tags: [apps]
  vars:
    can_become: true # input of the `common` role
  pre_tasks:
    - name: Load SOPS secrets
      community.sops.load_vars:
        file: "{{ homelab_secrets_file }}"
      tags: [always]
  roles:
    - common
    - ssh_access
    - docker_host
    - node_exporter
    - stacks

- name: AdGuard Home
  hosts: adguard
  tags: [adguard]
  pre_tasks:
    - name: Load SOPS secrets
      community.sops.load_vars:
        file: "{{ homelab_secrets_file }}"
      tags: [always]
  roles:
    - ssh_access
    - adguard
    - node_exporter

- name: WireGuard
  hosts: wireguard
  tags: [wireguard]
  pre_tasks:
    - name: Load SOPS secrets
      community.sops.load_vars:
        file: "{{ homelab_secrets_file }}"
      tags: [always]
  roles:
    - ssh_access
    - wireguard
    - node_exporter
