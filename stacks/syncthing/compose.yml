# Syncthing. Data: ZFS tank/syncthing (virtiofs -> /srv/syncthing).
name: syncthing

services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:v2.1.3-ls227
    container_name: syncthing
    hostname: syncthing
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - /srv/syncthing/config:/config
      - /srv/syncthing/data:/data
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
