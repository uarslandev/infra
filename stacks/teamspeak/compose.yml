# TeamSpeak 3. Data: ZFS tank/appdata/teamspeak.
name: teamspeak

services:
  teamspeak:
    image: teamspeak:3.13.7
    container_name: teamspeak
    ports:
      - "9987:9987/udp" # voice
      - "30033:30033/tcp" # file transfer
      # ServerQuery (10011) is intentionally not published.
    environment:
      TS3SERVER_LICENSE: accept
    volumes:
      - /srv/appdata/teamspeak:/var/ts3server
    restart: unless-stopped
