# Nginx Proxy Manager: LAN reverse proxy for local names. Data: ZFS tank/appdata/npm.
name: npm

services:
  npm:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81" # admin UI (LAN only, never routed through the tunnel)
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
      DISABLE_IPV6: "true"
    volumes:
      - /srv/appdata/npm/data:/data
      - /srv/appdata/npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
