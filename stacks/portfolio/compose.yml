# Portfolio: the personal website, static files only. The image is built on this host from
# a pinned commit of the private uarslandev/portfolio repo (cloned to ./src by
# roles/stacks/tasks/config/portfolio.yml). Astro builds to dist/, served by Caddy.
# Public: the whole site as uarslan.<domain> through the Cloudflare Tunnel (terraform/cloudflare).
name: portfolio

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: portfolio:${PORTFOLIO_VERSION}
    pull_policy: never # local image only, built from ./src
    container_name: portfolio-web
    user: "${PORTFOLIO_UID}:${PORTFOLIO_UID}"
    read_only: true
    tmpfs: [/tmp] # Caddy's state (XDG dirs point here); nothing is kept
    ports:
      - "127.0.0.1:8092:8080" # cloudflared (host network) reaches it here
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.portfolio.rule: Host(`portfolio.${LOCAL_DOMAIN}`)
      traefik.http.routers.portfolio.middlewares: lan-only@file
      traefik.http.services.portfolio.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop: [ALL] # non-root on a high port: needs no capabilities
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  proxy:
    external: true
