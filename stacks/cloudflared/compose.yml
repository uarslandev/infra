# Cloudflare Tunnel (public access). Host network so it can reach services on localhost.
# Token: secrets/homelab.sops.yml -> .env (never in git in plain text).
name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflared
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
